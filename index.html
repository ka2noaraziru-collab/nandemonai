
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>なんでもない場所</title>
<style>
* { box-sizing: border-box; }
body { margin: 0; font-family: "Yu Gothic", sans-serif; background: #f6f4ee; color: #202020; }
header { padding: 24px 7vw; display:flex; justify-content:space-between; border-bottom:1px solid #d8d6cf; font-size:13px; letter-spacing:.08em; }
.logo { font-weight:900; }
.pill { border:1px solid #aaa89f; border-radius:99px; padding:7px 12px; }
main { max-width:900px; margin:0 auto; padding:clamp(48px,10vw,110px) 7vw 80px; }
.eyebrow { font-size:12px; letter-spacing:.18em; margin-bottom:24px; }
h1 { font-size:clamp(44px,9vw,94px); line-height:1.04; letter-spacing:-.07em; margin:0 0 28px; font-weight:900; }
h1 span { background:#e7ff63; padding:0 .12em; }
.intro { max-width:560px; font-size:clamp(16px,2vw,20px); line-height:1.9; color:#55544f; }
.counter { margin:48px auto 28px; padding:22px; max-width:420px; text-align:center; border:1px solid #e0ded6; border-radius:18px; background:#fff; }
.counter-label { font-size:12px; letter-spacing:.12em; color:#77756e; }
#visit-count { display:block; margin-top:8px; font-size:clamp(36px,8vw,54px); font-weight:900; }
.counter-note { margin-top:8px; font-size:12px; color:#77756e; }
.card { margin-top:28px; background:#fff; border:1px solid #e0ded6; border-radius:22px; padding:clamp(22px,5vw,40px); display:grid; grid-template-columns:1fr auto; gap:24px; align-items:center; }
.card small { color:#77756e; }
.card h2 { font-size:clamp(23px,4vw,34px); margin:10px 0; }
.card p { line-height:1.8; color:#66645d; }
button { border:0; border-radius:100px; padding:15px 20px; font-size:15px; font-weight:800; background:#202020; color:white; cursor:pointer; }
#message { margin-top:22px; padding:18px 20px; background:#f0efea; border-radius:14px; line-height:1.8; display:none; }
footer { display:flex; justify-content:space-between; gap:12px; flex-wrap:wrap; border-top:1px solid #d8d6cf; padding:24px 7vw; font-size:12px; color:#77756e; }
@media(max-width:600px) { .card { grid-template-columns:1fr; } .card button { width:100%; } }
</style>
</head>
<body>
<header><div class="logo">NANDEMONAI.</div><div class="pill">NO. 001 / WEB EXPERIMENT</div></header>
<main>
  <div class="eyebrow">YOU FOUND A LITTLE SOMETHING</div>
  <h1>ここは、<br><span>なんでもない</span><br>場所です。</h1>
  <p class="intro">検索しても出てこない。誰かに教えるほどでもない。<br>でも、あなたが今ここを見ていることだけは、ちょっと面白い。</p>

  <section class="counter" aria-live="polite">
    <div class="counter-label">TOTAL VISITS</div>
    <span id="visit-count">---</span>
    <div class="counter-note">このサイトが開かれた累計回数（目安）</div>
  </section>

  <section class="card">
    <div>
      <small>本日のミッション</small>
      <h2>今日、ひとつだけ寄り道する。</h2>
      <p>いつもと違う道を通る。知らない店をのぞく。<br>そんな小さな冒険をしてみてください。</p>
    </div>
    <button id="reveal">秘密のメッセージ</button>
  </section>
  <div id="message" role="status"></div>
</main>
<footer><span>© NANDEMONAI. — 特に何も売っていません。</span><span>あなたの訪問を歓迎します。</span></footer>
<script>
const messages = [
  "おめでとうございます。秘密のメッセージを見つけました。内容は特にありません。",
  "このサイトを誰かに見せたら、たぶん「なにこれ」と言われます。それが正解です。",
  "あなたは今、インターネットのすみっこにいます。深呼吸して、よい一日を。",
  "今日のラッキーアイテムは、道ばたにある何かです。見つけても持ち帰らないでね。"
];
document.getElementById("reveal").addEventListener("click", () => {
  const box = document.getElementById("message");
  box.textContent = messages[Math.floor(Math.random() * messages.length)];
  box.style.display = "block";
});

// みんなで共有するアクセスカウンター
const visitCount = document.getElementById("visit-count");
fetch("https://api.counterapi.dev/v1/nandemonai-ka2noaraziru-collab/visits/up")
  .then(response => {
    if (!response.ok) throw new Error("Counter unavailable");
    return response.json();
  })
  .then(data => {
    const count = data.count ?? data.value;
    if (typeof count !== "number") throw new Error("Invalid counter response");
    visitCount.textContent = count.toLocaleString("ja-JP");
  })
  .catch(() => {
    visitCount.textContent = "—";
    document.querySelector(".counter-note").textContent = "アクセス数を読み込めませんでした。";
  });
</script>
</body>
</html>
